<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter Approved 2025</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<style>
body {
  background:#0e0f10;
  color:#fff;
  font-family: 'Segoe UI', sans-serif;
  margin:0;
  padding:0;
  text-align:center;
}
h1 {
  background:#1f3b73; /* Macragge Blue */
  color:white;
  margin:0;
  padding:1rem;
  font-size:1.4rem;
  letter-spacing:0.03em;
}
.container {
  max-width:900px;
  margin:2rem auto;
  padding:1rem;
}
button, select {
  background:#1f3b73;
  color:white;
  border:none;
  border-radius:8px;
  padding:0.5rem 1rem;
  margin:0.25rem;
  font-size:1rem;
}
button:hover, select:hover {
  background:#2750a0;
}
.card {
  background:#1a1b1e;
  border-radius:12px;
  margin:1rem 0;
  padding:1rem;
  text-align:left;
  box-shadow:0 0 10px rgba(0,0,0,0.5);
}
.card h2 {
  color:#d4af37; /* Gold heading */
  margin-top:0;
}
.md p {
  margin:0.9rem 0;
  color:#fff;
  white-space:pre-wrap; /* Keeps line breaks */
}
.md h1, .md h2 {
  color:#d4af37; /* Gold headings */
  margin:0.8rem 0 0.4rem;
}
.md ul {
  text-align:left;
  margin:0.5rem 0 0.5rem 1.5rem;
}
footer {
  font-size:0.75rem;
  color:#aaa;
  margin-top:3rem;
}
</style>
</head>
<body>
<h1>Chapter Approved 2025</h1>

<div class="container">
  <div>
    <button onclick="showCategory('secondary')">Secondary Missions</button>
    <button onclick="showCategory('primary')">Primary Missions</button>
    <button onclick="showCategory('terrain')">Terrain Layouts</button>
  </div>

  <input id="searchBox" type="text" placeholder="Search title..." style="margin-top:1rem;width:90%;padding:0.5rem;border-radius:6px;border:none;font-size:1rem;text-align:center;">
  
  <div id="cardList"></div>
</div>

<footer>
  Private reference for hobby use. Text & imagery © Games Workshop.
</footer>

<script>
const SOURCES = {
  secondary: "data/secondary.json",
  primary: "data/primary.json",
  terrain: "data/terrain.json"
};
let allCards = [];
let currentCategory = "secondary";

async function showCategory(cat){
  currentCategory = cat;
  document.getElementById("searchBox").value="";
  await loadCards(cat);
  renderCards();
}

async function loadCards(cat){
  const res = await fetch(SOURCES[cat]);
  allCards = await res.json();
}

function renderCards(){
  const list = document.getElementById("cardList");
  const search = document.getElementById("searchBox").value.toLowerCase();
  list.innerHTML="";
  let filtered = allCards.filter(c=>c.title.toLowerCase().includes(search));
  filtered.forEach(c=>{
    const card = document.createElement("div");
    card.className="card";
    card.innerHTML=`<h2>${c.title}</h2><div class='md'>${renderMarkdown(c.text)}</div>`;
    list.appendChild(card);
  });
}

document.getElementById("searchBox").addEventListener("input", renderCards);

function inlineMarkdown(line){
  return line
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\*(.+?)\*/g,'<i>$1</i>')
    .replace(/`(.+?)`/g,'<code>$1</code>');
}

// Improved Markdown renderer
function renderMarkdown(src){
  const text = src.replace(/\r/g,"");
  const lines = text.split("\n");

  let html = [];
  let inList = false;
  let para = [];

  const flushPara = () => {
    if (para.length){
      html.push(`<p>${para.map(l => inlineMarkdown(l)).join('<br>')}</p>`);
      para = [];
    }
  };
  const flushList = () => {
    if (inList){
      html.push('</ul>');
      inList = false;
    }
  };

  for (let i = 0; i < lines.length; i++){
    const line = lines[i];

    if (/^\s*$/.test(line)){
      flushList();
      flushPara();
      continue;
    }

    if (/^#{1,2}\s+/.test(line)){
      flushList();
      flushPara();
      const lvl = line.startsWith('##') ? 'h2' : 'h1';
      html.push(`<${lvl}>${inlineMarkdown(line.replace(/^#{1,2}\s+/, ''))}</${lvl}>`);
      continue;
    }

    if (/^\s*[-*]\s+/.test(line)){
      flushPara();
      if (!inList){ html.push('<ul>'); inList = true; }
      html.push(`<li>${inlineMarkdown(line.replace(/^\s*[-*]\s+/, ''))}</li>`);
      continue;
    }

    para.push(line);
  }

  flushList();
  flushPara();
  return html.join('\n');
}

// Initial load
loadCards(currentCategory).then(renderCards);
</script>
</body>
</html>
