<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter Approved 2025</title>
<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background-color: #0a0a0a;
    color: #ffffff;
  }

  /* Fix for iPhone/Android safe areas (top and bottom) */
  @supports (padding: env(safe-area-inset-top)) {
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
  }

  h1 {
    background-color: #123a7c; /* Macragge Blue */
    color: #ffffff;
    text-align: center;
    padding: 1.2em 0.5em;
    margin: 0;
    font-size: 1.5em;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 2px solid #d4af37; /* Gold trim */
  }

  .container {
    padding: 1em;
    padding-bottom: calc(1em + env(safe-area-inset-bottom)); /* extra safe zone for buttons */
  }

  .card {
    background-color: #121212;
    border: 1px solid #123a7c;
    border-radius: 10px;
    margin: 1em 0;
    padding: 0.5em 1em;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }

  .card h2 {
    background: #123a7c;
    margin: -0.5em -1em 0.5em -1em;
    padding: 0.7em;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
    color: #ffffff;
  }

  textarea {
    width: 100%;
    background: #0f0f0f;
    color: #ffffff;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 0.5em;
    resize: vertical;
    min-height: 100px;
    font-family: monospace;
  }

  button {
    background-color: #123a7c;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 0.5em 1em;
    margin-top: 0.5em;
    cursor: pointer;
  }

  button:hover {
    background-color: #1a56b3;
  }
</style>
</head>
<body>
<h1>40K Chapter Approved 2025</h1>

<div class="container">
  <div class="card">
    <h2>A Tempting Target</h2>
    <textarea placeholder="Tap to paste wording"></textarea>
    <button>Save</button>
  </div>

  <div class="card">
    <h2>Area Denial</h2>
    <textarea placeholder="Tap to paste wording"></textarea>
    <button>Save</button>
  </div>

  <div class="card">
    <h2>Behind Enemy Lines</h2>
    <textarea placeholder="Tap to paste wording"></textarea>
    <button>Save</button>
  </div>
</div>
</body>
</html>
