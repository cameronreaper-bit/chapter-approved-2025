<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chapter Approved 2025</title>

  <!-- PWA + iOS icon -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-512.png">

  <style>
    :root{
      --bg:#0e0f12; --panel:#12141a; --elev:#181b22;
      --blue:#1e3a78; --blue-grad:#274690;
      --gold:#d7c178; --text:#e9edf3; --muted:#9aa3b2;
      --chip:#2a2f3a; --card:#141820; --radius:16px;
      --shadow: 0 10px 24px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.25);
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;height:100%;
      background:var(--bg);color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      overflow-x:clip;max-width:100vw;
    }
    .wrap{max-width:980px;margin:0 auto;padding:28px 16px 60px}

    /* Header (blue) */
    .hero{
      background:linear-gradient(180deg,var(--blue),var(--blue-grad));
      border-bottom:2px solid rgba(215,193,120,.35);
      box-shadow:var(--shadow);
      border-radius:0 0 var(--radius) var(--radius);
      padding:14px 16px 14px;
      position:sticky; top:0; z-index:5;
      overflow:hidden; max-width:100vw;
    }
    .title{
      display:flex;align-items:center;gap:12px;
      margin:0 0 8px 0;
      font-weight:800;letter-spacing:.2px;font-size:22px;color:#fff
    }
    .logo40k{
      display:inline-flex;align-items:center;justify-content:center;
      width:44px;height:28px;border-radius:10px;
      background:linear-gradient(180deg,#1e3a78,#274690);
      border:1px solid rgba(215,193,120,.55);
      color:#fff;font-weight:900;font-size:14px;letter-spacing:.5px;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
      flex:0 0 auto;
    }
    .badge{
      background:rgba(215,193,120,.18);color:#fff;border:1px solid rgba(215,193,120,.5);
      padding:4px 10px;border-radius:999px;font-size:12px
    }
    .bar{display:grid;grid-template-columns:1fr auto;gap:10px;max-width:100%}
    .input,.select{background:#0f1218;border:1px solid #1f2531;border-radius:12px;
      padding:12px 12px;font-size:15px;color:#fff;outline:none;min-width:0}
    .tabs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
    .tab{background:var(--chip);color:#d9e2f1;border:1px solid #2f3746;cursor:pointer;
      padding:8px 12px;border-radius:999px;font-weight:600;font-size:13px}
    .tab.active{background:var(--gold);color:#101217;border-color:transparent}

    /* Cards */
    .grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:18px}
    @media(min-width:680px){.grid{grid-template-columns:1fr 1fr}}
    .card{background:linear-gradient(180deg,#191e28,#12161e);border:1px solid #242a37;
      border-radius:18px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;position:relative}
    .cardHead{
      background:linear-gradient(180deg,#1e3a78,#274690);
      color:#fff;padding:12px 14px;border-bottom:1px dashed rgba(255,255,255,.25);
      font-weight:800;letter-spacing:.3px;border-top:1px solid rgba(215,193,120,.45)
    }
    .cardBody{padding:12px 14px;color:var(--muted);font-size:14px;min-height:56px}
    .chipSaved{position:absolute;right:10px;top:10px;background:rgba(61,141,93,.18);
      border:1px solid rgba(61,141,93,.55);color:#bdf4cf;font-size:11px;padding:4px 8px;border-radius:999px}

    /* Terrain-only bits */
   .groupTitle{
  grid-column:1 / -1;
  background:linear-gradient(180deg,#1e1f22,#15161a);
  border:1px solid rgba(215,193,120,.4);
  border-radius:12px;
  padding:12px 16px;
  font-weight:900;
  font-size:20px;
  color:var(--gold);
  letter-spacing:.3px;
  text-align:left;
  box-shadow:var(--shadow);
  margin-top:10px;
}

    .imgWrap{padding:10px}
    .imgWrap img{
      display:block;width:100%;height:auto;border-radius:12px;
      border:1px solid #2a3242;background:#0f1218
    }

    /* Modal */
    .modal{
      position:fixed;inset:0;background:rgba(0,0,0,.5);
      display:none;align-items:center;justify-content:center;
      padding:clamp(8px,2vh,16px);z-index:20;
      max-width:100vw;overflow-x:clip;
    }
    .modal.show{display:flex}
    .panel{
      width:min(820px,96vw);max-height:92vh;overflow:auto;
      background:linear-gradient(180deg,var(--panel),var(--elev));
      border:1px solid #2a3242;border-radius:18px;box-shadow:var(--shadow);
      padding:0; display:block;
    }
    .panelHead{
      position:sticky; top:0; z-index:1;
      background:linear-gradient(180deg,var(--panel),#151922);
      border-bottom:1px solid #2a3242;
      display:flex;align-items:center;justify-content:space-between;gap:8px;
      padding:14px 16px;
    }
    .panelTitle{font-weight:900;font-size:18px;color:#fff}
    .btns{display:flex;gap:8px;flex-wrap:wrap}
    .btn{border-radius:12px;border:1px solid #2b3241;background:#12161e;color:#dde4f1;
      padding:10px 12px;font-weight:700;font-size:14px;cursor:pointer}
    .btn.gold{background:var(--gold);color:#141616;border:0}
    .btn.danger{border-color:#4a2626;background:#1a0f10;color:#f3c9c9}
    .panelBody{padding:16px}
    .txt{
      width:100%;min-height:220px;background:#0f1218;color:#eff3fb;border:1px solid #263042;
      border-radius:12px;padding:12px;font-size:15px;line-height:1.45;resize:vertical;margin-top:10px
    }

    /* Markdown preview styling */
    .md{background:#0c1017;border:1px solid #263042;border-radius:12px;padding:12px;margin-top:8px}
    .md h1,.md h2{margin:.2rem 0 .5rem 0; color:var(--gold)}
    .md h1{font-size:1.2rem} .md h2{font-size:1.05rem}
    .md p{margin:0.9rem 0;color:#fff;white-space:pre-wrap}
    .md ul{margin:.35rem 0 .35rem 1.1rem}
    .md li{margin:.2rem 0;color:#e8edf8}
    .md em{font-style:italic} .md strong{font-weight:800;color:#fff}
    .hint{color:#9fb0c9;font-size:12px;margin-top:6px}
    .footer{opacity:.8;font-size:12px;margin-top:14px}
    
/* ===== SCORING TAB STYLES ===== */
.scoreWrap {
  display: grid;
  gap: 12px;
}
.nameRow {
  display: grid;
  grid-template-columns: 1fr 1fr auto auto;
  gap: 8px;
}
.nameInput {
  background: #0f1218;
  border: 1px solid #1f2531;
  border-radius: 12px;
  padding: 10px 12px;
  color: #fff;
  font-size: 15px;
}
.scoreTable {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  overflow: hidden;
  border: 1px solid #2a3242;
  border-radius: 14px;
  box-shadow: var(--shadow);
}
.scoreTable th,
.scoreTable td {
  padding: 10px 12px;
  border-bottom: 1px dashed #2a3242;
  text-align: center;
}
.scoreTable thead th {
  background: linear-gradient(180deg, #1e3a78, #274690);
  color: #fff;
  font-weight: 800;
}
.scoreTable tfoot td {
  background: #131823;
  font-weight: 800;
}
.num {
  width: 72px;
  text-align: center;
  background: #0f1218;
  border: 1px solid #1f2531;
  border-radius: 10px;
  padding: 8px 10px;
  color: #fff;
}
.btn.small {
  padding: 8px 10px;
  font-size: 13px;
}
    @media (max-width:600px){
      .hero{padding:10px 12px 10px;}
      .title{font-size:20px;margin:0 0 6px;gap:10px}
      .badge{font-size:11px;padding:3px 8px}
      .logo40k{width:40px;height:26px;font-size:13px;border-radius:9px}
      .bar{
        display:grid;
        grid-template-columns:1fr auto;
        grid-template-areas:
          "search jump"
          "tabs   tabs";
        gap:8px; align-items:center;
      }
      #search.input{grid-area:search}
      #jump.select{grid-area:jump}
      .tabs{grid-area:tabs;margin-top:4px;gap:7px}
      .input,.select{padding:10px 12px;font-size:16px}
      .tab{padding:7px 10px;font-size:13px}
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="wrap">
      <div class="title">
        <span class="logo40k">40K</span>
        Chapter Approved 2025
        <span class="badge">Offline-capable</span>
      </div>

      <div class="bar">
        <input id="search" class="input" placeholder="Search titles…" />
        <select id="jump" class="select"></select>
        <div class="tabs">
          <button class="tab active" data-tab="primary">Primary Missions</button>
          <button class="tab" data-tab="terrain">Terrain Layouts</button>
          <button class="tab" data-tab="secondary">Secondary Missions</button>
          <button class="tab" data-tab="scoring">Scoring</button>
        </div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div id="grid" class="grid"></div>
    <div class="footer">Private table reference. Text & imagery © Games Workshop. No affiliation.</div>
  </div>

  <!-- Text Modal (editor/preview) -->
  <div id="modal" class="modal" role="dialog" aria-modal="true">
    <div class="panel">
      <div class="panelHead">
        <div class="panelTitle" id="modalTitle">Title</div>
        <div class="btns">
          <button id="previewBtn" class="btn">Preview</button>
          <button id="exportBtn" class="btn">Export text</button>
          <label class="btn">
            Import text<input type="file" id="importFile" accept="application/json" style="display:none">
          </label>
          <button id="deleteBtn" class="btn danger">Clear text</button>
          <button id="saveBtn" class="btn gold">Save</button>
          <button id="closeBtn" class="btn">Close</button>
        </div>
      </div>

      <div class="panelBody">
        <div id="mdPreview" class="md" style="display:none"></div>
        <textarea id="modalTxt" class="txt" placeholder="Use markdown:
## Heading
- Bullet
**Bold** and *italics*"></textarea>
        <div class="hint">Single Enter = line break · Blank line = new paragraph · <code>##</code> heading is gold · <code>- </code> bullets · <code>**bold**</code>, <code>*italics*</code>.</div>
      </div>
    </div>
  </div>

  <!-- Image viewer (for terrain) -->
  <div id="imgModal" class="modal" role="dialog" aria-modal="true">
    <div class="panel">
      <div class="panelHead">
        <div class="panelTitle" id="imgTitle">Layout</div>
        <div class="btns"><button id="imgClose" class="btn gold">Close</button></div>
      </div>
      <div class="panelBody">
        <img id="imgFull" alt="" style="width:100%;height:auto;border-radius:12px;border:1px solid #2a3242;display:block;">
      </div>
    </div>
  </div>

<script>
(() => {
  const SOURCES = { primary:"data/primary.json", terrain:"data/terrain.json", secondary:"data/secondary.json" };
  
  // ==== SCORING: state + helpers ====
  const SCORING_KEY = 'ca2025:scoring:v1';
  let scoring = null;

  function loadScoring(){
    try{
      const raw = localStorage.getItem(SCORING_KEY);
      if(raw){
        scoring = JSON.parse(raw);
      }else{
        scoring = {
          players: { a: 'Player A', b: 'Player B' },
          // 5 rounds, each with primary/secondary for A & B
          rounds: Array.from({length:5}, ()=>({
            a:{p:0,s:0}, b:{p:0,s:0}
          }))
        };
      }
    }catch(e){
      scoring = {
        players: { a: 'Player A', b: 'Player B' },
        rounds: Array.from({length:5}, ()=>({
          a:{p:0,s:0}, b:{p:0,s:0}
        }))
      };
    }
  }

  function saveScoring(){
    try{ localStorage.setItem(SCORING_KEY, JSON.stringify(scoring)); }catch(e){}
  }

  function totals(){
    let aP=0,aS=0,bP=0,bS=0;
    scoring.rounds.forEach(r=>{
      aP += Number(r.a.p||0); aS += Number(r.a.s||0);
      bP += Number(r.b.p||0); bS += Number(r.b.s||0);
    });
    return {
      aPrim:aP, aSec:aS, aTotal:aP+aS,
      bPrim:bP, bSec:bS, bTotal:bP+bS
    };
  }

  let currentTab = "secondary";
  let items = [];
  const grid = document.getElementById('grid');
  const search = document.getElementById('search');
  const jump   = document.getElementById('jump');

  // Text modal bits
  const modal  = document.getElementById('modal');
  const modalTitle = document.getElementById('modalTitle');
  const modalTxt   = document.getElementById('modalTxt');
  const mdPreview  = document.getElementById('mdPreview');
  const previewBtn = document.getElementById('previewBtn');

  // Image modal bits
  const imgModal = document.getElementById('imgModal');
  const imgTitle = document.getElementById('imgTitle');
  const imgFull  = document.getElementById('imgFull');

  const keyFor = (tab,title)=>`ca2025:text:${tab}:${title}`;

  document.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', async () => {
      document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      search.value = "";

      if(currentTab === 'scoring'){
        renderScoring();
        return;
      }
      await loadAndRender();
    });
  });

  async function fetchJson(url){
    const res = await fetch(url, {cache:"no-cache"});
    if(!res.ok) throw new Error(res.status);
    return res.json();
  }

  async function loadAndRender(){
    // NEW: scoring tab short-circuit
  if (currentTab === 'scoring') {
    renderScoring();
    return;
  }
    try{
      const data = await fetchJson(SOURCES[currentTab]);
      renderFromData(data || {});
    }catch(e){
      grid.innerHTML = `<div style="opacity:.8">Failed to load ${currentTab}.json</div>`;
    }
  }

  function renderFromData(data){
    // TERRAIN uses {groups:[{name, items:[{title,src},...]}, ...]}
    if(currentTab === 'terrain' && Array.isArray(data.groups)){
      const groups = data.groups;
      // Build Jump options (all terrain titles)
      const allItems = groups.flatMap(g => (g.items||[]));
      buildJump(allItems);

      grid.innerHTML = groups.map(group=>{
        const header = `<div class="groupTitle" data-group="${escapeHtml(group.name)}">${escapeHtml(group.name)}</div>`;
        const imgs = (group.items||[]).map(it=>`
          <div class="card terrain" data-title="${escapeHtml(it.title)}" data-src="${escapeHtml(it.src)}">
            <div class="cardHead">${escapeHtml(it.title)}</div>
            <div class="imgWrap"><img src="${escapeHtml(it.src)}" alt="${escapeHtml(it.title)}"></div>
          </div>
        `).join('');
        return header + imgs;
      }).join('');

      // Click: open image viewer
      grid.querySelectorAll('.card.terrain').forEach(card=>{
        card.addEventListener('click', ()=>{
          imgTitle.textContent = card.dataset.title || 'Layout';
          imgFull.src = card.dataset.src || '';
          imgModal.classList.add('show');
        });
      });

      // Terrain search filters by title
      search.oninput = ()=>{
        const q = search.value.trim().toLowerCase();
        grid.querySelectorAll('.card.terrain').forEach(c=>{
          const t = (c.dataset.title||'').toLowerCase();
          c.style.display = q && !t.includes(q) ? 'none' : '';
        });
      };

      return; // done
    }

    // DEFAULT (secondary/primary) path (unchanged from your version)
    const raw = Array.isArray(data) ? data : (data.items||[]);
    items = raw.slice().sort((a,b)=>a.title.localeCompare(b.title));
    buildJump(items);
    renderTextCards(items);
  }

  function renderTextCards(list){
    const q = search.value.trim().toLowerCase();
    const filtered = q ? list.filter(x=>x.title.toLowerCase().includes(q)) : list;
    grid.innerHTML = filtered.map(x=>{
      const saved = localStorage.getItem(keyFor(currentTab, x.title));
      const firstLine = (saved||x.text||"").split(/\r?\n/)[0] || "Tap to paste wording";
      return `
        <div class="card" data-title="${escapeHtml(x.title)}">
          <div class="cardHead">${escapeHtml(x.title)}</div>
          <div class="cardBody">${escapeHtml(firstLine)}</div>
          ${saved ? `<div class="chipSaved">Saved</div>` : ""}
        </div>`;
    }).join('') || `<div style="opacity:.8">No results.</div>`;

    grid.querySelectorAll('.card').forEach(card=>{
      card.addEventListener('click',()=>openEditor(card.dataset.title));
    });
  }

  function buildJump(list){
    const letters = [...new Set(list.map(x=>x.title[0].toUpperCase()))].sort();
    jump.innerHTML = `<option value="">A–Z jump</option>`+
      letters.map(l=>`<option value="${l}">${l}</option>`).join('');
  }
  jump.addEventListener('change', ()=>{
    const letter = jump.value;
    if(!letter) return;
    const el = [...grid.querySelectorAll('.card')].find(c=>{
      const t = c.dataset.title || '';
      return t.startsWith(letter);
    });
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  });
  search.addEventListener('input', ()=>renderTextCards(items)); // no-op during terrain; overridden above

  // ---- Text modal handlers (unchanged) ----
  function openEditor(title){
    if(currentTab === 'terrain'){ return; } // no editor for terrain
    modalTitle.textContent = title;
    const saved = localStorage.getItem(keyFor(currentTab,title));
    modalTxt.value = saved || "";
    mdPreview.style.display = "none";
    mdPreview.innerHTML = "";
    modal.classList.add('show');
    modalTxt.focus();
  }
  document.getElementById('closeBtn').onclick = ()=> modal.classList.remove('show');
  document.getElementById('deleteBtn').onclick = ()=>{
    localStorage.removeItem(keyFor(currentTab, modalTitle.textContent));
    modalTxt.value="";
    mdPreview.style.display="none";
    renderTextCards(items);
  };
  document.getElementById('saveBtn').onclick = ()=>{
    localStorage.setItem(keyFor(currentTab, modalTitle.textContent), modalTxt.value);
    modal.classList.remove('show');
    renderTextCards(items);
  };

  previewBtn.addEventListener('click', ()=>{
    if(mdPreview.style.display === "none"){
      mdPreview.innerHTML = renderMarkdown(modalTxt.value);
      mdPreview.style.display = "block";
    }else{
      mdPreview.style.display = "none";
    }
  });

  // Export (unchanged)
  document.getElementById('exportBtn').onclick = ()=>{
    try{
      const dump = {};
      items.forEach(it=>{
        const k = keyFor(currentTab, it.title);
        const v = localStorage.getItem(k);
        if (v != null) dump[it.title] = v;
      });
      const payload = JSON.stringify({tab:currentTab, entries:dump}, null, 2);
      const blob = new Blob([payload], {type:"application/json"});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `ca2025-${currentTab}-text.json`;
      a.rel = 'noopener';
      a.style.display = 'none';
      document.body.appendChild(a);
      requestAnimationFrame(()=>{
        a.click();
        requestAnimationFrame(()=>{
          URL.revokeObjectURL(a.href);
          a.remove();
        });
      });
    }catch(err){
      console.error('Export failed:', err);
      alert('Export failed. Open DevTools → Console and tell me the red error lines.');
    }
  };

  // Image modal close
  document.getElementById('imgClose').onclick = ()=> imgModal.classList.remove('show');

  function escapeHtml(s){ return String(s||"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;","»":"&raquo;","<":"&lt;","\"":"&quot;","'":"&#39;"}[c])); }
  function normalize(s){ return String(s||"").replace(/\r\n/g,"\n").replace(/\r/g,"\n"); }

  // Markdown
  function renderMarkdown(src){
    const text = normalize(src);
    const lines = text.split("\n");
    let html = [], inList = false, para = [];
    const flushPara = () => {
      if (para.length){
        const joined = para.join("\n");
        const rendered = inlineMarkdown(joined).replace(/\n/g, "<br>");
        html.push(`<p>${rendered}</p>`);
        para = [];
      }
    };
    const flushList = () => { if (inList){ html.push('</ul>'); inList = false; } };
    for (let i = 0; i < lines.length; i++){
      const line = lines[i];
      if (/^\s*$/.test(line)){ flushList(); flushPara(); continue; }
      if (/^#{1,2}\s+/.test(line)){
        flushList(); flushPara();
        const lvl = line.startsWith('##') ? 'h2' : 'h1';
        html.push(`<${lvl}>${inlineMarkdown(line.replace(/^#{1,2}\s+/, ''))}</${lvl}>`);
        continue;
      }
      if (/^\s*[-*]\s+/.test(line)){
        flushPara();
        if (!inList){ html.push('<ul>'); inList = true; }
        html.push(`<li>${inlineMarkdown(line.replace(/^\s*[-*]\s+/, ''))}</li>`);
        continue;
      }
      para.push(line);
    }
    flushList(); flushPara();
    return html.join('\n');
  }

  function inlineMarkdown(s){
    s = String(s||"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*(?!\*)([\s\S]+?)\*(?!\*)/g, "$1<em>$2</em>");
    return s;
  }
// ======= Scoring helpers & renderer =======
function loadScoreState(){
  try {
    const raw = localStorage.getItem(SCORING_KEY);
    if (!raw) return structuredClone(DEFAULT_SCORING_STATE);
    const parsed = JSON.parse(raw);
    // Defensive: ensure shape matches
    if (!parsed || !Array.isArray(parsed.rounds) || parsed.rounds.length !== 5) {
      return structuredClone(DEFAULT_SCORING_STATE);
    }
    return parsed;
  } catch {
    return structuredClone(DEFAULT_SCORING_STATE);
  }
}

function saveScoreState(state){
  localStorage.setItem(SCORING_KEY, JSON.stringify(state));
}

function sumPlayer(state, which /* 'p1' or 'p2' */){
  let total = 0;
  for (const r of state.rounds){
    total += Number(r[which+'p']||0) + Number(r[which+'s']||0);
  }
  return total;
}

function inputNum(val){
  const n = Number(val);
  return Number.isFinite(n) && n >= 0 ? Math.floor(n) : 0;
}

function renderScoring(){
  const state = loadScoreState();

  // Build the scoring UI into #grid
  grid.innerHTML = `
    <div class="scoreWrap">
      <div class="nameRow">
        <input id="p1Name" class="nameInput" value="${escapeHtml(state.p1)}" aria-label="Player 1 name">
        <input id="p2Name" class="nameInput" value="${escapeHtml(state.p2)}" aria-label="Player 2 name">
        <button id="swapNames" class="btn small" type="button">Swap</button>
        <button id="resetScores" class="btn small danger" type="button">Reset</button>
      </div>

      <table class="scoreTable">
        <thead>
          <tr>
            <th>Round</th>
            <th>${escapeHtml(state.p1)} – Primary</th>
            <th>${escapeHtml(state.p1)} – Secondary</th>
            <th>${escapeHtml(state.p2)} – Primary</th>
            <th>${escapeHtml(state.p2)} – Secondary</th>
          </tr>
        </thead>
        <tbody>
          ${state.rounds.map((r, idx) => `
            <tr data-row="${idx}">
              <td style="font-weight:800">${idx+1}</td>
              <td><input class="num" inputmode="numeric" pattern="[0-9]*" data-field="p1p" value="${r.p1p}"></td>
              <td><input class="num" inputmode="numeric" pattern="[0-9]*" data-field="p1s" value="${r.p1s}"></td>
              <td><input class="num" inputmode="numeric" pattern="[0-9]*" data-field="p2p" value="${r.p2p}"></td>
              <td><input class="num" inputmode="numeric" pattern="[0-9]*" data-field="p2s" value="${r.p2s}"></td>
            </tr>
          `).join('')}
        </tbody>
        <tfoot>
          <tr>
            <td style="text-align:right">Totals</td>
            <td id="t_p1p"></td>
            <td id="t_p1s"></td>
            <td id="t_p2p"></td>
            <td id="t_p2s"></td>
          </tr>
          <tr>
            <td style="text-align:right">Current Total</td>
            <td colspan="2" id="t_p1" style="text-align:center"></td>
            <td colspan="2" id="t_p2" style="text-align:center"></td>
          </tr>
        </tfoot>
      </table>
    </div>
  `;

  // Hook up name changes
  const p1Name = document.getElementById('p1Name');
  const p2Name = document.getElementById('p2Name');
  const swapBtn = document.getElementById('swapNames');
  const resetBtn = document.getElementById('resetScores');

  function refreshHeadings(){
    const thead = grid.querySelector('.scoreTable thead tr');
    thead.children[1].textContent = `${p1Name.value} – Primary`;
    thead.children[2].textContent = `${p1Name.value} – Secondary`;
    thead.children[3].textContent = `${p2Name.value} – Primary`;
    thead.children[4].textContent = `${p2Name.value} – Secondary`;
  }

  p1Name.addEventListener('input', ()=>{
    state.p1 = p1Name.value || 'Player 1';
    saveScoreState(state);
    refreshHeadings();
  });
  p2Name.addEventListener('input', ()=>{
    state.p2 = p2Name.value || 'Player 2';
    saveScoreState(state);
    refreshHeadings();
  });

  swapBtn.addEventListener('click', ()=>{
    const tmp = state.p1; state.p1 = state.p2; state.p2 = tmp;
    const tmpR = state.rounds.map(r=>({p1p:r.p2p, p1s:r.p2s, p2p:r.p1p, p2s:r.p1s}));
    state.rounds = tmpR;
    saveScoreState(state);
    // re-render cleanly
    renderScoring();
  });

  resetBtn.addEventListener('click', ()=>{
    if(!confirm('Reset all scores and names?')) return;
    const fresh = structuredClone(DEFAULT_SCORING_STATE);
    saveScoreState(fresh);
    renderScoring();
  });

  // Hook up number inputs
  grid.querySelectorAll('tbody tr').forEach(tr=>{
    const rowIdx = Number(tr.getAttribute('data-row'));
    tr.querySelectorAll('input.num').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const field = inp.getAttribute('data-field'); // p1p, p1s, p2p, p2s
        state.rounds[rowIdx][field] = inputNum(inp.value);
        saveScoreState(state);
        updateTotals(state);
      });
    });
  });

  function updateTotals(s){
    let p1p=0,p1s=0,p2p=0,p2s=0;
    for(const r of s.rounds){ p1p+=r.p1p; p1s+=r.p1s; p2p+=r.p2p; p2s+=r.p2s; }
    const $ = id => document.getElementById(id);
    $('t_p1p').textContent = p1p;
    $('t_p1s').textContent = p1s;
    $('t_p2p').textContent = p2p;
    $('t_p2s').textContent = p2s;
    $('t_p1').textContent  = String(p1p + p1s);
    $('t_p2').textContent  = String(p2p + p2s);
  }

  // Initial totals
  updateTotals(state);
}
  // ==== SCORING: UI (stacked cards, mobile-friendly, no horizontal scroll) ====

  function buildScoreCardsHTML(){
    const t = totals();

    const namesHTML = `
      <div class="scoreNames" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
        <input id="pAName" class="input" placeholder="Player A" value="${escapeHtml(scoring.players.a)}" />
        <input id="pBName" class="input" placeholder="Player B" value="${escapeHtml(scoring.players.b)}" />
      </div>
    `;

    const cards = scoring.rounds.map((r, i) => {
      const rNum = i+1;
      return `
        <div class="roundCard">
          <div class="roundHead">Round ${rNum}</div>
          <div class="row">
            <div class="col">
              <div class="lbl">${escapeHtml(scoring.players.a)}</div>
              <div class="fields">
                <label>Primary
                  <input type="number" min="0" max="15" step="1"
                         data-r="${i}" data-pl="a" data-kind="p"
                         value="${Number(r.a.p)||0}">
                </label>
                <label>Secondary
                  <input type="number" min="0" max="15" step="1"
                         data-r="${i}" data-pl="a" data-kind="s"
                         value="${Number(r.a.s)||0}">
                </label>
              </div>
            </div>
            <div class="col">
              <div class="lbl">${escapeHtml(scoring.players.b)}</div>
              <div class="fields">
                <label>Primary
                  <input type="number" min="0" max="15" step="1"
                         data-r="${i}" data-pl="b" data-kind="p"
                         value="${Number(r.b.p)||0}">
                </label>
                <label>Secondary
                  <input type="number" min="0" max="15" step="1"
                         data-r="${i}" data-pl="b" data-kind="s"
                         value="${Number(r.b.s)||0}">
                </label>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');

    const totalsHTML = `
      <div class="totalsBar">
        <div class="tot">
          <div class="name">${escapeHtml(scoring.players.a)}</div>
          <div class="nums">
            <span>P: <strong>${t.aPrim}</strong></span>
            <span>S: <strong>${t.aSec}</strong></span>
            <span>Total: <strong>${t.aTotal}</strong></span>
          </div>
        </div>
        <div class="tot">
          <div class="name">${escapeHtml(scoring.players.b)}</div>
          <div class="nums">
            <span>P: <strong>${t.bPrim}</strong></span>
            <span	S: <strong>${t.bSec}</strong></span>
            <span>Total: <strong>${t.bTotal}</strong></span>
          </div>
        </div>
      </div>
    `;

    const actionsHTML = `
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button id="resetScores" class="btn danger">Reset</button>
      </div>
    `;

    return `
      <div class="scoreWrap">
        ${namesHTML}
        ${cards}
        ${totalsHTML}
        ${actionsHTML}
      </div>
    `;
  }

  function renderScoring(){
    // clear grid and render scoring UI
    loadScoring();
    grid.innerHTML = buildScoreCardsHTML();

    // Names
    const pA = document.getElementById('pAName');
    const pB = document.getElementById('pBName');
    pA?.addEventListener('input', () => {
      scoring.players.a = pA.value.trim() || 'Player A';
      saveScoring();
      updateTotalsBar(); // refresh names in totals
      // also refresh round labels
      document.querySelectorAll('.roundCard .col .lbl')[0].textContent = scoring.players.a;
    });
    pB?.addEventListener('input', () => {
      scoring.players.b = pB.value.trim() || 'Player B';
      saveScoring();
      updateTotalsBar();
      document.querySelectorAll('.roundCard .col .lbl')[1].textContent = scoring.players.b;
    });

    // Scores
    grid.querySelectorAll('input[type="number"][data-r]').forEach(inp=>{
      inp.addEventListener('input', handleScoreInput);
    });

    // Reset
    const resetBtn = document.getElementById('resetScores');
    resetBtn?.addEventListener('click', ()=>{
      if(!confirm('Clear all scores and names?')) return;
      localStorage.removeItem(SCORING_KEY);
      loadScoring();
      renderScoring();
    });

    updateTotalsBar();
  }

  function handleScoreInput(e){
    const el = e.currentTarget;
    const r = Number(el.getAttribute('data-r'));
    const pl = el.getAttribute('data-pl'); // 'a' | 'b'
    const kind = el.getAttribute('data-kind'); // 'p' | 's'
    const val = Math.max(0, Number(el.value||0));
    // clamp a bit (you can change if you like)
    el.value = String(val);
    scoring.rounds[r][pl][kind] = val;
    saveScoring();
    updateTotalsBar();
  }

  function updateTotalsBar(){
    const t = totals();
    const totEls = grid.querySelectorAll('.totalsBar .tot');
    if(totEls[0]){
      totEls[0].querySelector('.name').textContent = scoring.players.a;
      const spans = totEls[0].querySelectorAll('.nums span strong');
      spans[0].textContent = t.aPrim;
      spans[1].textContent = t.aSec;
      spans[2].textContent = t.aTotal;
    }
    if(totEls[1]){
      totEls[1].querySelector('.name').textContent = scoring.players.b;
      const spans = totEls[1].querySelectorAll('.nums span strong');
      spans[0].textContent = t.bPrim;
      spans[1].textContent = t.bSec;
      spans[2].textContent = t.bTotal;
    }
  }

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  }
  loadAndRender();
})();
</script>
</body>
</html>
