<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chapter Approved 2025</title>
<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background-color: #0a0a0a;
    color: #ffffff;
  }

  /* Safe-area fix for iPhone/Android */
  @supports (padding: env(safe-area-inset-top)) {
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    body {
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }
  }

  header {
    background-color: #123a7c; /* Macragge Blue */
    color: white;
    text-align: center;
    padding: 1.2em 0.5em;
    border-bottom: 2px solid #d4af37; /* Gold trim */
    font-size: 1.5em;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .tabs {
    display: flex;
    justify-content: center;
    background-color: #1a1a1a;
    padding: 0.5em;
    border-bottom: 1px solid #333;
  }

  .tab {
    background-color: #123a7c;
    border: none;
    color: white;
    padding: 0.6em 1.2em;
    margin: 0 0.3em;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1em;
  }

  .tab:hover {
    background-color: #1b56b3;
  }

  .container {
    padding: 1em;
    max-width: 800px;
    margin: 0 auto;
  }

  .card {
    background-color: #121212;
    border: 1px solid #123a7c;
    border-radius: 10px;
    margin: 1em 0;
    padding: 0.5em 1em;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
  }

  .card h2 {
    background: #123a7c;
    margin: -0.5em -1em 0.5em -1em;
    padding: 0.7em;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
    color: #ffffff;
  }

  textarea {
    width: 100%;
    background: #0f0f0f;
    color: #ffffff;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 0.5em;
    resize: vertical;
    min-height: 100px;
    font-family: monospace;
  }

  button {
    background-color: #123a7c;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 0.5em 1em;
    margin-top: 0.5em;
    cursor: pointer;
  }

  button:hover {
    background-color: #1a56b3;
  }
</style>
</head>
<body>
<header>40K Chapter Approved 2025</header>

<div class="tabs">
  <button class="tab">Primary Missions</button>
  <button class="tab">Terrain Layouts</button>
  <button class="tab">Secondary Missions</button>
</div>

<div class="container">
  <div class="card">
    <h2>A Tempting Target</h2>
    <textarea placeholder="Tap to paste wording"></textarea>
    <button>Save</button>
  </div>

  <div class="card">
    <h2>Area Denial</h2>
    <textarea placeholder="Tap to paste wording"></textarea>
    <button>Save</button>
  </div>

  <div class="card">
    <h2>Behind Enemy Lines</h2>
    <textarea placeholder="Tap to paste wording"></textarea>
    <button>Save</button>
  </div>
</div>
</body>
</html>
